<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Building analytic_person — aggregation and join flow</title>
<desc>Five clinical tables are aggregated by person_id then left-joined sequentially onto PERSON to produce one row per person in analytic_person.</desc>
<style>
  .box { stroke-width: 1.5; rx: 10; }
  .src { fill: #FEF3C7; stroke: #D97706; }
  .agg { fill: #DCFCE7; stroke: #16A34A; }
  .join { fill: #F3F4F6; stroke: #9CA3AF; }
  .base { fill: #DBEAFE; stroke: #2563EB; }
  .final { fill: #FCE7E7; stroke: #DC2626; }
  .title { font: 700 13px system-ui, sans-serif; fill: #111827; }
  .sub { font: 11px system-ui, sans-serif; fill: #374151; }
  .lbl { font: 11px system-ui, sans-serif; fill: #6B7280; }
  .h1 { font: 700 20px system-ui, sans-serif; fill: #111827; }
  .legend-text { font: 12px system-ui, sans-serif; fill: #374151; }
  .arrow { stroke: #6B7280; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="#6B7280"/>
  </marker>
</defs>
<text x="700" y="30" text-anchor="middle" class="h1">Building analytic_person — aggregate, then join</text>
<rect x="20" y="60" width="150" height="42" class="box src"/>
<text x="95" y="86" text-anchor="middle" class="title">VISIT_OCCURRENCE</text>
<rect x="200" y="60" width="170" height="42" class="box src"/>
<text x="285" y="86" text-anchor="middle" class="title">CONDITION_OCCURRENCE</text>
<rect x="400" y="60" width="150" height="42" class="box src"/>
<text x="475" y="86" text-anchor="middle" class="title">DRUG_EXPOSURE</text>
<rect x="620" y="60" width="150" height="42" class="box src"/>
<text x="695" y="86" text-anchor="middle" class="title">MEASUREMENT</text>
<text x="95" y="120" text-anchor="middle" class="lbl">groupBy person_id</text>
<path d="M95,102 L95,132" class="arrow"/>
<text x="285" y="120" text-anchor="middle" class="lbl">groupBy person_id</text>
<path d="M285,102 L285,132" class="arrow"/>
<text x="475" y="120" text-anchor="middle" class="lbl">groupBy person_id</text>
<path d="M475,102 L475,132" class="arrow"/>
<text x="640" y="120" text-anchor="middle" class="lbl">groupBy / filter HbA1c / filter SBP</text>
<path d="M660,102 L660,132" class="arrow"/>
<path d="M695,102 L800,132" class="arrow"/>
<path d="M730,102 L930,132" class="arrow"/>
<rect x="20" y="132" width="150" height="58" class="box agg"/>
<text x="95" y="152" text-anchor="middle" class="title">visit agg</text>
<text x="95" y="168" text-anchor="middle" class="sub">total / outpatient /</text>
<text x="95" y="182" text-anchor="middle" class="sub">inpatient / ER counts</text>
<rect x="200" y="132" width="170" height="58" class="box agg"/>
<text x="285" y="152" text-anchor="middle" class="title">condition agg</text>
<text x="285" y="168" text-anchor="middle" class="sub">condition_count</text>
<text x="285" y="182" text-anchor="middle" class="sub">has_diabetes / has_hypertension</text>
<rect x="400" y="132" width="150" height="58" class="box agg"/>
<text x="475" y="152" text-anchor="middle" class="title">drug agg</text>
<text x="475" y="172" text-anchor="middle" class="sub">drug_exposure_count</text>
<rect x="600" y="132" width="180" height="58" class="box agg"/>
<text x="690" y="152" text-anchor="middle" class="title">measurement agg</text>
<text x="690" y="168" text-anchor="middle" class="sub">measurement_count</text>
<text x="690" y="182" text-anchor="middle" class="sub">latest_measurement_date</text>
<rect x="800" y="132" width="150" height="58" class="box agg"/>
<text x="875" y="152" text-anchor="middle" class="title">latest HbA1c</text>
<text x="875" y="172" text-anchor="middle" class="sub">latest_hba1c</text>
<rect x="970" y="132" width="160" height="58" class="box agg"/>
<text x="1050" y="152" text-anchor="middle" class="title">latest systolic BP</text>
<text x="1050" y="172" text-anchor="middle" class="sub">latest_systolic_bp</text>
<rect x="20" y="230" width="150" height="46" class="box base"/>
<text x="95" y="258" text-anchor="middle" class="title">PERSON (base)</text>
<path d="M95,276 L95,300" class="arrow"/>
<path d="M95,190 L95,300" class="arrow"/>
<rect x="20" y="300" width="150" height="34" class="box join"/>
<text x="95" y="321" text-anchor="middle" class="sub">left join · + visit agg</text>
<path d="M95,334 L95,358" class="arrow"/>
<path d="M285,190 Q285,346 170,358" class="arrow"/>
<rect x="20" y="358" width="220" height="34" class="box join"/>
<text x="130" y="379" text-anchor="middle" class="sub">left join · + condition agg</text>
<path d="M130,392 L130,416" class="arrow"/>
<path d="M475,190 Q475,404 240,416" class="arrow"/>
<rect x="20" y="416" width="290" height="34" class="box join"/>
<text x="165" y="437" text-anchor="middle" class="sub">left join · + drug agg</text>
<path d="M165,450 L165,474" class="arrow"/>
<path d="M690,190 Q690,462 300,474" class="arrow"/>
<rect x="20" y="474" width="360" height="34" class="box join"/>
<text x="200" y="495" text-anchor="middle" class="sub">left join · + measurement agg</text>
<path d="M200,508 L200,532" class="arrow"/>
<path d="M875,190 Q875,520 370,532" class="arrow"/>
<rect x="20" y="532" width="430" height="34" class="box join"/>
<text x="235" y="553" text-anchor="middle" class="sub">left join · + latest HbA1c</text>
<path d="M235,566 L235,590" class="arrow"/>
<path d="M1050,190 Q1050,578 440,590" class="arrow"/>
<rect x="20" y="590" width="500" height="34" class="box join"/>
<text x="270" y="611" text-anchor="middle" class="sub">left join · + latest systolic BP</text>
<path d="M270,624 L270,650" class="arrow"/>
<rect x="150" y="650" width="240" height="56" class="box final"/>
<text x="270" y="674" text-anchor="middle" class="title">ANALYTIC_PERSON</text>
<text x="270" y="692" text-anchor="middle" class="sub">one row per person · 15 columns</text>
<g transform="translate(560,650)">
  <rect width="780" height="130" rx="10" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="20" y="26" class="title" font-size="13">Legend</text>
  <rect x="20" y="40" width="18" height="18" class="box base"/>
  <text x="46" y="54" class="legend-text">Base table (PERSON)</text>
  <rect x="220" y="40" width="18" height="18" class="box src"/>
  <text x="246" y="54" class="legend-text">Clinical source table</text>
  <rect x="440" y="40" width="18" height="18" class="box agg"/>
  <text x="466" y="54" class="legend-text">Aggregated by person_id</text>
  <rect x="20" y="70" width="18" height="18" class="box join"/>
  <text x="46" y="84" class="legend-text">Sequential left join</text>
  <rect x="220" y="70" width="18" height="18" class="box final"/>
  <text x="246" y="84" class="legend-text">Final output</text>
  <text x="20" y="112" class="legend-text" fill="#6B7280">All joins are left joins on person_id — missing aggregates default to 0 / false / null via coalesce().</text>
</g>
</svg>
