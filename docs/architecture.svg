<svg viewBox="0 0 860 1120" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Block 1 Batch Pipeline Architecture</title>
<desc>Synthea CLI generates raw export, generator.py maps to OMOP tables, pipeline.py validates cleans and builds analytic_person, written as partitioned Parquet.</desc>
<style>
  .box { stroke-width: 1.5; rx: 10; }
  .tool { fill: #E5E7EB; stroke: #9CA3AF; }
  .data { fill: #FEF3C7; stroke: #D97706; }
  .code { fill: #DBEAFE; stroke: #2563EB; }
  .out { fill: #DCFCE7; stroke: #16A34A; }
  .title { font: 700 15px system-ui, sans-serif; fill: #111827; }
  .sub { font: 12px system-ui, sans-serif; fill: #374151; }
  .tag { font: 600 11px system-ui, sans-serif; fill: #ffffff; }
  .step { font: 11px system-ui, sans-serif; fill: #1F2937; }
  .arrow { stroke: #6B7280; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .legend-text { font: 12px system-ui, sans-serif; fill: #374151; }
  .h1 { font: 700 20px system-ui, sans-serif; fill: #111827; }
</style>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6B7280"/>
  </marker>
</defs>
<text x="430" y="34" text-anchor="middle" class="h1">Block 1 — Batch Pipeline Architecture</text>
<rect x="310" y="60" width="240" height="54" class="box tool"/>
<text x="430" y="82" text-anchor="middle" class="title">Synthea CLI</text>
<text x="430" y="100" text-anchor="middle" class="sub">synthetic patient generator</text>
<rect x="556" y="60" width="70" height="24" rx="12" fill="#4B5563"/>
<text x="591" y="76" text-anchor="middle" class="tag">Java 21</text>
<path d="M430,114 L430,140" class="arrow"/>
<rect x="290" y="140" width="280" height="54" class="box data"/>
<text x="430" y="162" text-anchor="middle" class="title">data/synthea_raw/</text>
<text x="430" y="180" text-anchor="middle" class="sub">native Synthea CSV export</text>
<path d="M430,194 L430,220" class="arrow"/>
<rect x="260" y="220" width="340" height="76" class="box code"/>
<text x="430" y="244" text-anchor="middle" class="title">src/generator.py</text>
<text x="430" y="262" text-anchor="middle" class="sub">concept mapping · NOTE text · dirty-data injection</text>
<rect x="480" y="270" width="100" height="22" rx="11" fill="#2563EB"/>
<text x="530" y="285" text-anchor="middle" class="tag">Python · pandas</text>
<path d="M430,296 L430,322" class="arrow"/>
<rect x="230" y="322" width="400" height="86" class="box data"/>
<text x="430" y="346" text-anchor="middle" class="title">data/raw/ — 6 OMOP-style tables</text>
<text x="430" y="366" text-anchor="middle" class="sub">Person · Visit · Condition · Drug</text>
<text x="430" y="382" text-anchor="middle" class="sub">Measurement · Note</text>
<path d="M430,408 L430,434" class="arrow"/>
<rect x="180" y="434" width="500" height="330" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="430" y="460" text-anchor="middle" class="title">src/pipeline.py — orchestration</text>
<rect x="560" y="440" width="90" height="22" rx="11" fill="#2563EB"/>
<text x="605" y="455" text-anchor="middle" class="tag">PySpark</text>
<rect x="210" y="478" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="320" y="499" text-anchor="middle" class="step">1 · Read raw CSVs</text>
<rect x="440" y="478" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="550" y="499" text-anchor="middle" class="step">2 · Validate raw (log-only)</text>
<rect x="210" y="522" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="320" y="543" text-anchor="middle" class="step">3 · Clean — drop dirty rows</text>
<rect x="440" y="522" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="550" y="543" text-anchor="middle" class="step">4 · Validate cleaned (hard gate)</text>
<rect x="210" y="566" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="320" y="587" text-anchor="middle" class="step">5 · Build analytic_person</text>
<rect x="440" y="566" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="550" y="587" text-anchor="middle" class="step">6 · Write partitioned Parquet</text>
<rect x="210" y="610" width="220" height="34" rx="8" fill="#ffffff" stroke="#93C5FD"/>
<text x="320" y="631" text-anchor="middle" class="step">7 · Write pipeline metrics</text>
<text x="430" y="672" text-anchor="middle" class="sub" fill="#6B7280">supporting modules</text>
<rect x="210" y="682" width="90" height="26" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
<text x="255" y="699" text-anchor="middle" class="step">config.py</text>
<rect x="308" y="682" width="90" height="26" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
<text x="353" y="699" text-anchor="middle" class="step">schemas.py</text>
<rect x="406" y="682" width="100" height="26" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
<text x="456" y="699" text-anchor="middle" class="step">io_utils.py</text>
<rect x="514" y="682" width="105" height="26" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
<text x="566" y="699" text-anchor="middle" class="step">validations.py</text>
<rect x="360" y="716" width="110" height="26" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
<text x="415" y="733" text-anchor="middle" class="step">transforms.py</text>
<path d="M430,764 L430,790" class="arrow"/>
<rect x="230" y="790" width="400" height="90" class="box out"/>
<text x="430" y="814" text-anchor="middle" class="title">data/processed/</text>
<text x="430" y="834" text-anchor="middle" class="sub">analytic_person — partitioned Parquet</text>
<text x="430" y="852" text-anchor="middle" class="sub">(by year_of_birth_band) + pipeline_metrics.json</text>
<g transform="translate(60,940)">
  <rect width="740" height="150" rx="10" fill="#FAFAFA" stroke="#E5E7EB"/>
  <text x="20" y="26" class="title" font-size="13">Legend</text>
  <rect x="20" y="40" width="18" height="18" class="box tool"/>
  <text x="46" y="54" class="legend-text">External tool</text>
  <rect x="180" y="40" width="18" height="18" class="box data"/>
  <text x="206" y="54" class="legend-text">Data artifact (CSV/Parquet)</text>
  <rect x="420" y="40" width="18" height="18" class="box code"/>
  <text x="446" y="54" class="legend-text">Code module</text>
  <rect x="580" y="40" width="18" height="18" class="box out"/>
  <text x="606" y="54" class="legend-text">Final output</text>
  <text x="20" y="90" class="legend-text" font-weight="600">Tech stack:</text>
  <text x="20" y="112" class="legend-text">Java 21 (Synthea)  ·  Python 3.11+  ·  pandas  ·  PySpark  ·  Parquet  ·  pytest (102 tests)</text>
  <text x="20" y="134" class="legend-text" fill="#6B7280">Deterministic: RANDOM_SEED=42, REFERENCE_DATE=2025-01-01</text>
</g>
</svg>
